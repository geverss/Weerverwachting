<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Maritieme en astronomische duikplanner voor de Oosterschelde">
  <title>SportPlanner</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.01em;
    }

    .picker-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="date"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: inherit;
      color: #ffffff;
      background-color: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="date"]:focus {
      border-color: var(--accent);
    }

    .output-card {
      background-color: #0b1120;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .data-list {
      list-style: none;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .data-list > li {
      margin-bottom: 12px;
    }

    .data-list > li:last-child {
      margin-bottom: 0;
    }

    strong {
      color: #ffffff;
    }

    .sub-item {
      padding-left: 20px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    .footer-status {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background-color: #22c55e;
    }

    .status-badge.offline {
      background-color: #f59e0b;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.9rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <main class="container">
    <header>
      <h1>Oosterschelde Duikplanner</h1>
    </header>

    <div class="picker-group">
      <label for="dive-date">Duikdatum selecteren</label>
      <input type="date" id="dive-date">
    </div>

    <section class="output-card" aria-live="polite">
      <div id="output-content">Gegevens laden...</div>
    </section>

    <div class="footer-status">
      <div>
        <span class="status-badge" id="status-dot"></span>
        <span id="cache-status">Synchroniseren...</span>
      </div>
      <span id="cache-date"></span>
    </div>
  </main>

  <script>
    const CACHE_KEY = "oosterschelde_duik_cache";
    const META_KEY = "duik_cache_meta";
    const dateInput = document.getElementById("dive-date");
    const outputContent = document.getElementById("output-content");
    const statusDot = document.getElementById("status-dot");
    const cacheStatus = document.getElementById("cache-status");
    const cacheDate = document.getElementById("cache-date");

    // Stel standaard datum in op vandaag (lokale tijdzone)
    const now = new Date();
    const localToday = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
      .toISOString()
      .split("T")[0];
    dateInput.value = localToday;

    function renderDetails(dateKey) {
      const rawData = localStorage.getItem(CACHE_KEY);
      const cache = rawData ? JSON.parse(rawData) : null;

      if (!cache || !cache[dateKey]) {
        outputContent.innerHTML = `
          <div class="error-msg">
            Geen offline gegevens gevonden voor ${dateKey}.<br>
            Controleer de internetverbinding om de nieuwste maandcache te laden.
          </div>
        `;
        return;
      }

      const item = cache[dateKey];

      outputContent.innerHTML = `
        <ul class="data-list">
          <li>* <strong>Datum:</strong> ${item.datum}</li>
          <li>* <strong>Maanfase:</strong> ${item.maan}</li>
          <li>* <strong>Laatste getij van de dag:</strong>
            <div class="sub-item">• <strong>Wemeldinge:</strong> ${item.wemeldinge_tij}</div>
            <div class="sub-item">• <strong>Stavenisse:</strong> ${item.stavenisse_tij}</div>
          </li>
          <li>* <strong>Wind Oosterschelde:</strong> ${item.wind_oosterschelde}</li>
          <li>* <strong>Weer & Wind Nijlen:</strong> ${item.weer_nijlen}</li>
          <li>* <strong>Zon:</strong> ${item.zon}</li>
        </ul>
      `;
    }

    async function syncCache() {
      try {
        const response = await fetch("data.json?cache_bust=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) throw new Error("Netwerkfout bij ophalen data.json");

        const data = await response.json();
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        
        const timestamp = new Date().toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
        localStorage.setItem(META_KEY, timestamp);

        statusDot.classList.remove("offline");
        cacheStatus.textContent = "Cache actueel";
        cacheDate.textContent = "Vandaag " + timestamp;
      } catch (err) {
        statusDot.classList.add("offline");
        cacheStatus.textContent = "Offline modus (lokale cache)";
        const savedMeta = localStorage.getItem(META_KEY);
        cacheDate.textContent = savedMeta ? "Laatste sync: " + savedMeta : "";
      } finally {
        renderDetails(dateInput.value);
      }
    }

    dateInput.addEventListener("change", (e) => {
      renderDetails(e.target.value);
    });

    // Registratie Service Worker voor volledige PWA-functionaliteit
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {
          // SW draait stil op de achtergrond
        });
      });
    }

    // Direct tonen uit eventueel aanwezige cache, daarna updaten
    renderDetails(dateInput.value);
    syncCache();
  </script>
</body>
</html>
